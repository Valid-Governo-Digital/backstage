apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-hub-cfg
  labels:
    app: backstage-hub
data:
  NODE_ENV: "production"
  POSTGRES_HOST: "backstage-hub-postgres"
  POSTGRES_PORT: "5432"
  # AUTH_GITHUB_CLIENT_ID / AUTH_GITHUB_CLIENT_SECRET saíram daqui: agora são
  # credenciais reais de um OAuth App e vivem no Secret backstage-hub-secrets.
  # (Em envFrom o Secret é listado depois do ConfigMap e venceria de qualquer forma,
  # mas manter placeholders aqui só serve para mascarar um Secret mal configurado.)
